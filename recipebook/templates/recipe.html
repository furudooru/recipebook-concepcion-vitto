<html lang="en-US">
<head>
    <title>Recipe Book</title>
</head>
<body>
    <h1>
        Recipe Book
    </h1>
        <ul>
        {% for ingredient in object.ingredients.all %}
            <li>{{ingredient.ingredient.name}}</li>
            <ul>
                {{ingredient.quantity}}
            </ul>
        {% endfor %}
        </ul>
</body>
</html>
